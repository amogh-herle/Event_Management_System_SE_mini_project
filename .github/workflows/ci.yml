name: CI

# Covers the checks the project's own test plan (Documents/TEST-CASE_DOCUMENT.pdf)
# and SRS (Documents/SRS_DOCUMENT.pdf) call for on every change:
#   - FR-001..FR-010 behavior: tests/*.test.ts run against a real Postgres
#     service, the same engine production uses (SERIALIZABLE transactions
#     for FR-008 concurrency control need real Postgres, not a mock).
#   - NFR-007 (Maintainability): enforces the SRS's 80% line-coverage
#     target for the core business logic modules (registration, capacity
#     check, waitlist promotion, notifications, central logger) - see
#     scripts/check-core-coverage.ts. A module below 80% fails the build.
#   - Type safety and a production build, so a change that breaks `next
#     build` or introduces a type error never reaches main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ems_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ems_ci
      SESSION_SECRET: ci-only-session-secret-not-for-real-use
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS). Node 20 is end-of-life and its test runner does
          # not discover .ts test files, so it silently ran zero tests.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to the CI database
        run: npx prisma db push --accept-data-loss

      - name: Type check
        run: npx tsc --noEmit

      # NODE_ENV=test (above) makes lib/mailer.ts use an in-memory
      # jsonTransport instead of real SMTP, so this never sends real email
      # even if EMAIL_USER/EMAIL_PASS end up set in the environment.
      # Runs the whole suite once, writing an lcov coverage report.
      - name: Run test suite (with coverage)
        run: npm run test:coverage

      # NFR-007: fails the build if any core module, or the core modules
      # combined, drop below 80% line coverage.
      - name: Check core-module coverage (NFR-007, 80% line target)
        run: npx tsx scripts/check-core-coverage.ts coverage/lcov.info

      - name: Build production bundle
        run: npm run build
